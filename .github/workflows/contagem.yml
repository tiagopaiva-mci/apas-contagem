name: Atualizar contagem

on:
  schedule:
    - cron: "5 3 * * *"   # todo dia às 00:05 (horário de Brasília)
  workflow_dispatch:       # botão "Run workflow" para rodar na hora

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Escolher a imagem do dia
        run: |
          pip install pillow
          python3 scripts/atualizar.py

      - name: Salvar no repositório (mantém a automação ativa)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/contagem.png
          git diff --cached --quiet || git commit -m "Contagem $(date -u -d '-3 hours' +%Y-%m-%d)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
